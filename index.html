<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Ana Ivankovic" />
    <meta name="color-scheme" content="dark light" />

    <title>BalkanBaddie</title>
    <link rel="stylesheet" href="./assets/style/normal.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="topbar">
      <div class="logo">BalkanBaddie</div>
      <form class="search">
        <input type="text" placeholder="Search..." />
        <button>🔍</button>
      </form>
      <form class="light-switch" action="">
        <label>
          <input type="checkbox" switch name="theme" value="dark-theme" />
          Dark Mode
        </label>
      </form>
    </header>

    <main>
      <section class="welcome-section">
        <h1>Welcome Balkanbaddie</h1>

        <img
          src="balkangirls-removebg-preview.png"
          alt="Chatgpt gegenereerde afbeelding balkangirls in traditionele klederdracht."
        />
      </section>

      <div class="box">
        <i></i>
        Skincare
      </div>

      <article>
        <h3>Skincare</h3>
        <p>here we give some grandma/ aunty tips for Skincare</p>
      </article>

      <article>
        <h4>Haircare</h4>
        <p>here we give some haircare tips</p>
      </article>
    </main>

    <footer>
      <p>Made by Ana Ivankovic</p>
    </footer>

    <dialog open>
      <p>Cookies-popup</p>
      <form method="dialog">
        <button>OK</button>
      </form>
    </dialog>
  </body>
</html>
